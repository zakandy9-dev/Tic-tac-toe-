<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✕ Tic-Tac-Toe ⭕</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body {
            min-height: 100vh; margin: 0;
            background: linear-gradient(145deg, #1e2b3c 0%, #0f1a26 100%);
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .game-container {
            background: #2a3a4b; border-radius: 40px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.05);
            padding: 25px 25px 30px; max-width: 560px; width: 100%;
        }
        h1 {
            text-align: center; margin: 0 0 15px; font-size: 2rem;
            font-weight: 500; letter-spacing: 5px; color: #eef4ff;
            text-shadow: 0 4px 10px #0a1118, 0 0 8px #5f7f9f;
        }

        /* MODE SELECTOR */
        .mode-tabs {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 8px; background: #1a2836; padding: 6px;
            border-radius: 50px; margin-bottom: 18px;
            box-shadow: inset 0 4px 6px #0b1219;
        }
        .mode-tab {
            padding: 12px 8px; border-radius: 40px; border: none;
            background: transparent; color: #7d95ad;
            font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px;
            cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .mode-tab.active {
            background: #3a5a7a; color: #ffffff;
            box-shadow: 0 4px 10px -2px #0b1219, inset 0 -2px 0 #2a4258;
        }
        .mode-tab:not(.active):hover { color: #b8cde0; }

        /* ONLINE PANEL */
        .room-panel {
            background: #1e2d3b; border-radius: 24px; padding: 14px 16px;
            margin-bottom: 16px; box-shadow: inset 0 4px 6px #0b1219, 0 6px 10px #0f1a24;
        }
        .room-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
        .room-row:last-child { margin-bottom: 0; }
        .room-label { color: #9db4cc; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; min-width: 80px; }
        .room-input {
            flex: 1; min-width: 100px; background: #0f1a26; border: 1px solid #3a5068;
            border-radius: 40px; padding: 10px 14px; color: #eef4ff;
            font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;
            outline: none; transition: 0.2s; box-shadow: inset 0 3px 6px #060c11;
        }
        .room-input:focus { border-color: #7fe0b0; }
        .room-input::placeholder { color: #4d637a; letter-spacing: 0.5px; font-weight: 400; }
        .small-btn {
            background: #1f3140; border: none; border-radius: 40px; padding: 10px 16px;
            font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px; color: #dfeaf5;
            box-shadow: 0 6px 10px -4px #0b1219, inset 0 -2px 0 #2d4055, inset 0 2px 6px #53728f;
            cursor: pointer; transition: 0.12s; white-space: nowrap;
        }
        .small-btn:hover:not(:disabled) { background: #284153; color: #ffffff; }
        .small-btn:active:not(:disabled) { transform: translateY(2px); }
        .small-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .connection-status {
            display: flex; align-items: center; gap: 8px; padding: 8px 14px;
            border-radius: 30px; background: #17222e; font-size: 0.8rem;
            font-weight: 600; color: #b8cde0;
        }
        .dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ff6b6b; box-shadow: 0 0 8px #ff6b6b;
            flex-shrink: 0; transition: 0.3s;
        }
        .dot.connected { background: #7fe0b0; box-shadow: 0 0 10px #7fe0b0; }
        .dot.waiting { background: #ffc107; box-shadow: 0 0 10px #ffc107; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* STATUS */
        .status {
            text-align: center; font-size: 1.25rem; font-weight: 600; color: #d9e6f2;
            background: #1e2d3b; padding: 12px 18px; border-radius: 50px; margin: 0 0 18px;
            box-shadow: inset 0 4px 6px #0b1219, 0 6px 10px #0f1a24;
            min-height: 52px; display: flex; align-items: center; justify-content: center;
            letter-spacing: 0.5px;
        }

        /* BOARD */
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .cell {
            aspect-ratio: 1/1; background: #1c2b39; border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 4.5rem; font-weight: 700; color: #f0f7ff; text-shadow: 0 8px 12px #0b1117;
            box-shadow: 0 12px 15px -5px #0e1a24, inset 0 -3px 0 #2f4053, inset 0 3px 8px #3a5068;
            cursor: pointer; transition: 0.15s ease; user-select: none; padding: 0 0 8px 0; line-height: 1;
        }
        .cell.disabled { cursor: not-allowed; }
        .cell:not(.disabled):hover { background: #233646; }
        .cell:not(.disabled):active { transform: scale(0.96); }
        .cell.win { background: #2e5f4e; box-shadow: 0 0 0 3px #7fe0b0, 0 12px 15px -5px #0e1a24; color: #d6ffe6; }

        /* CONTROLS */
        .controls { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .btn {
            background: #1f3140; border: none; border-radius: 50px; padding: 14px 26px;
            font-size: 1rem; font-weight: 600; letter-spacing: 1px; color: #dfeaf5;
            box-shadow: 0 10px 12px -5px #0b1219, inset 0 -3px 0 #2d4055, inset 0 2px 8px #53728f;
            cursor: pointer; transition: 0.12s;
        }
        .btn:hover:not(:disabled) { background: #284153; color: #ffffff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.primary { background: #2b5a8c; box-shadow: 0 10px 12px -5px #0b1219, inset 0 -3px 0 #1a3c60, inset 0 2px 8px #4a7fbb; }
        .btn.primary:hover:not(:disabled) { background: #356ba0; }

        .footer { text-align: center; margin-top: 16px; font-size: 0.8rem; color: #6c839b; letter-spacing: 0.5px; }
        .marker-badge { display: inline-block; padding: 2px 12px; border-radius: 30px; font-weight: 800; font-size: 0.85rem; margin-left: 6px; }
        .badge-x { background: #2b5a8c; color: #cce6ff; }
        .badge-o { background: #7a3e5c; color: #ffd9ec; }
        .hidden { display: none !important; }

        /* DIFFICULTY */
        .difficulty-row {
            display: flex; gap: 8px; justify-content: center;
            margin-bottom: 14px; flex-wrap: wrap;
        }
        .diff-btn {
            background: #17222e; border: 1px solid #2f4053; border-radius: 30px;
            padding: 8px 16px; font-size: 0.8rem; font-weight: 700;
            color: #7d95ad; cursor: pointer; letter-spacing: 0.5px;
            transition: 0.15s;
        }
        .diff-btn.active {
            background: #3a5a7a; color: #ffffff; border-color: #4a7fbb;
            box-shadow: 0 0 10px rgba(74,127,187,0.4);
        }

        @media (max-width: 480px) {
            .game-container { padding: 18px 16px 24px; border-radius: 30px; }
            h1 { font-size: 1.5rem; letter-spacing: 3px; }
            .status { font-size: 1rem; }
            .cell { font-size: 3.5rem; border-radius: 18px; }
            .mode-tab { font-size: 0.7rem; padding: 10px 4px; }
            .room-label { min-width: 65px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>✕ TIC–TAC–TOE ⭕</h1>

    <!-- MODE SELECTOR -->
    <div class="mode-tabs">
        <button class="mode-tab active" data-mode="ai">🤖 vs CPU</button>
        <button class="mode-tab" data-mode="local">👥 Pass &amp; Play</button>
        <button class="mode-tab" data-mode="online">🌐 Online</button>
    </div>

    <!-- DIFFICULTY (only for AI mode) -->
    <div class="difficulty-row" id="difficultyRow">
        <button class="diff-btn" data-diff="easy">😊 Easy</button>
        <button class="diff-btn active" data-diff="medium">😐 Medium</button>
        <button class="diff-btn" data-diff="hard">😈 Hard</button>
    </div>

    <!-- ONLINE PANEL (only shown in online mode) -->
    <div class="room-panel hidden" id="onlinePanel">
        <div class="room-row">
            <span class="room-label">YOUR ID</span>
            <input type="text" class="room-input" id="myIdInput" placeholder="Generating..." readonly>
            <button class="small-btn" id="copyIdBtn" disabled>📋</button>
        </div>
        <div class="room-row">
            <span class="room-label">PARTNER</span>
            <input type="text" class="room-input" id="partnerIdInput" placeholder="Paste friend's ID">
            <button class="small-btn" id="connectBtn" disabled>🔗</button>
        </div>
        <div class="room-row" style="justify-content: space-between;">
            <div class="connection-status">
                <span class="dot" id="statusDot"></span>
                <span id="connectionText">Not connected</span>
            </div>
            <button class="small-btn" id="disconnectBtn" disabled>✖</button>
        </div>
    </div>

    <div class="status" id="statusMessage">Your turn (X)</div>

    <div class="board" id="board"></div>

    <div class="controls">
        <button class="btn primary" id="resetButton">🔄 New Game</button>
    </div>

    <div class="footer" id="roleFooter">Choose a mode to play</div>
</div>

<script>
(function() {
    // ============================================================
    // CONFIG
    // ============================================================
    const WINNING_COMBOS = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];
    const PEER_SERVERS = [
        { host: '0.peerjs.com', port: 443, secure: true, path: '/', key: 'peerjs' },
        { host: 'peerjs.92k.de', port: 443, secure: true, path: '/', key: 'peerjs' }
    ];
    const CONNECT_TIMEOUT = 12000;

    // ============================================================
    // STATE
    // ============================================================
    let mode = 'ai';              // 'ai' | 'local' | 'online'
    let difficulty = 'medium';    // 'easy' | 'medium' | 'hard'
    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameActive = true;
    let winner = null;
    let aiThinking = false;

    // Online state
    let myMarker = null;          // 'X' or 'O' when online
    let peer = null;
    let connection = null;
    let myPeerId = null;
    let isConnected = false;
    let connecting = false;
    let serverIndex = 0;
    let connectTimeout = null;

    // ============================================================
    // DOM
    // ============================================================
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('statusMessage');
    const resetBtn = document.getElementById('resetButton');
    const modeTabs = document.querySelectorAll('.mode-tab');
    const difficultyRow = document.getElementById('difficultyRow');
    const diffBtns = document.querySelectorAll('.diff-btn');
    const onlinePanel = document.getElementById('onlinePanel');
    const myIdInput = document.getElementById('myIdInput');
    const partnerIdInput = document.getElementById('partnerIdInput');
    const copyIdBtn = document.getElementById('copyIdBtn');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusDot = document.getElementById('statusDot');
    const connectionText = document.getElementById('connectionText');
    const roleFooter = document.getElementById('roleFooter');

    // ============================================================
    // UI HELPERS
    // ============================================================
    function updateStatusMessage() {
        if (mode === 'online' && !isConnected) {
            statusEl.textContent = 'Connect to a partner to play';
            return;
        }
        if (winner === 'draw') {
            statusEl.textContent = "🤝 It's a draw!";
        } else if (winner) {
            if (mode === 'ai') {
                statusEl.textContent = winner === 'X' ? '🎉 You win!' : '😢 CPU wins!';
            } else if (mode === 'online') {
                statusEl.textContent = winner === myMarker ? '🎉 You win!' : '😢 Opponent wins!';
            } else {
                statusEl.textContent = `🎉 Player ${winner} wins!`;
            }
        } else {
            if (mode === 'ai') {
                if (aiThinking) statusEl.textContent = '🤖 CPU thinking...';
                else statusEl.textContent = 'Your turn (X)';
            } else if (mode === 'online') {
                statusEl.textContent = (currentPlayer === myMarker ? 'Your turn' : "Opponent's turn") + ` (${currentPlayer})`;
            } else {
                statusEl.textContent = `Player ${currentPlayer}'s turn`;
            }
        }
    }

    function setBoardEnabled(enabled) {
        document.querySelectorAll('.cell').forEach(cell => {
            if (!enabled) {
                cell.classList.add('disabled');
                return;
            }
            if (cell.dataset.value) { cell.classList.add('disabled'); return; }
            // Mode-specific rules
            if (mode === 'ai') {
                if (currentPlayer === 'X' && gameActive && !winner) cell.classList.remove('disabled');
                else cell.classList.add('disabled');
            } else if (mode === 'local') {
                if (gameActive && !winner) cell.classList.remove('disabled');
                else cell.classList.add('disabled');
            } else if (mode === 'online') {
                if (isConnected && gameActive && !winner && currentPlayer === myMarker) cell.classList.remove('disabled');
                else cell.classList.add('disabled');
            }
        });
    }

    function updateRoleFooter() {
        if (mode === 'ai') {
            roleFooter.textContent = 'You are X — good luck!';
        } else if (mode === 'local') {
            roleFooter.textContent = 'Two players, one device';
        } else if (mode === 'online') {
            if (myMarker) {
                const cls = myMarker === 'X' ? 'badge-x' : 'badge-o';
                roleFooter.innerHTML = `You are <span class="marker-badge ${cls}">${myMarker}</span>`;
            } else {
                roleFooter.textContent = 'Share your ID with a friend';
            }
        }
    }

    // ============================================================
    // BOARD
    // ============================================================
    function createBoardUI() {
        boardEl.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell disabled';
            cell.dataset.index = i;
            cell.dataset.value = '';
            cell.addEventListener('click', handleCellClick);
            boardEl.appendChild(cell);
        }
    }

    function updateBoardUI() {
        document.querySelectorAll('.cell').forEach((cell, idx) => {
            cell.textContent = board[idx] || '';
            cell.dataset.value = board[idx] || '';
            cell.classList.remove('win');
        });
    }

    function highlightWinningCells(combo) {
        const cells = document.querySelectorAll('.cell');
        combo.forEach(i => cells[i].classList.add('win'));
    }

    // ============================================================
    // GAME LOGIC
    // ============================================================
    function checkWinner() {
        for (let combo of WINNING_COMBOS) {
            const [a,b,c] = combo;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                return { winner: board[a], combo };
            }
        }
        if (board.every(cell => cell !== null)) return { winner: 'draw', combo: null };
        return { winner: null, combo: null };
    }

    function placeMark(index, mark) {
        if (board[index] !== null) return false;
        board[index] = mark;
        const cells = document.querySelectorAll('.cell');
        cells[index].textContent = mark;
        cells[index].dataset.value = mark;

        const result = checkWinner();
        if (result.winner) {
            gameActive = false;
            if (result.winner === 'draw') {
                winner = 'draw';
            } else {
                winner = result.winner;
                highlightWinningCells(result.combo);
            }
            updateStatusMessage();
            setBoardEnabled(false);
            return true;
        }
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatusMessage();
        setBoardEnabled(true);
        return true;
    }

    function resetGame(notifyPeer = true) {
        board = Array(9).fill(null);
        currentPlayer = 'X';
        gameActive = true;
        winner = null;
        aiThinking = false;
        updateBoardUI();
        setBoardEnabled(true);
        updateStatusMessage();
        updateRoleFooter();

        if (notifyPeer && mode === 'online' && connection && connection.open) {
            connection.send({ type: 'reset' });
        }
    }

    function handleCellClick(e) {
        if (!gameActive || winner) return;
        const cell = e.currentTarget;
        const index = parseInt(cell.dataset.index, 10);
        if (board[index] !== null) return;

        if (mode === 'ai') {
            if (currentPlayer !== 'X' || aiThinking) return;
            placeMark(index, 'X');
            if (gameActive && !winner) {
                aiThinking = true;
                updateStatusMessage();
                setBoardEnabled(false);
                setTimeout(aiMove, 400 + Math.random() * 300);
            }
        } else if (mode === 'local') {
            placeMark(index, currentPlayer);
        } else if (mode === 'online') {
            if (!isConnected || currentPlayer !== myMarker) return;
            if (!placeMark(index, myMarker)) return;
            if (connection && connection.open) {
                connection.send({ type: 'move', index, mark: myMarker });
            }
        }
    }

    // ============================================================
    // AI
    // ============================================================
    function aiMove() {
        if (!gameActive || winner || mode !== 'ai') return;

        const empty = [];
        for (let i = 0; i < 9; i++) if (board[i] === null) empty.push(i);
        if (empty.length === 0) return;

        let index;
        if (difficulty === 'easy') {
            index = empty[Math.floor(Math.random() * empty.length)];
        } else if (difficulty === 'medium') {
            // 50% best move, 50% random
            if (Math.random() < 0.5) {
                index = findBestMove();
            } else {
                index = empty[Math.floor(Math.random() * empty.length)];
            }
        } else {
            index = findBestMove();
        }

        placeMark(index, 'O');
        aiThinking = false;
        updateStatusMessage();
        setBoardEnabled(true);
    }

    function findBestMove() {

        let bestScore = -Infinity;
